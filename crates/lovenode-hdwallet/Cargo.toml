[package]
name = "lovenode-hdwallet"
description = "BIP39 recovery phrase + BIP32/BIP44 HD derivation, interoperable with the Divi Core wallet (coin type 301, path m/44'/301'/a'/c/i)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lovenode-sign = { path = "../lovenode-sign" }
secp256k1 = { version = "0.29", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
getrandom = "0.2"
zeroize = "1"
