[package]
name = "lovenode-app"
description = "LoveNode — stake DIVI from your phone. The Tauri shell around the tested Rust staking core."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geoffmccabe/Divi-lovenode"

# This crate is built by `cargo tauri android/ios`, not the main cargo workspace,
# so it is its own workspace root (the empty table below stops it trying to join
# the pure-Rust workspace at the repo root). Its path deps still resolve against
# that workspace, where those crates live.
[workspace]

# Tauri mobile builds the Rust as a library linked into the Android/iOS host.
[lib]
name = "lovenode_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

lovenode-core = { path = "../../crates/lovenode-core" }
lovenode-sign = { path = "../../crates/lovenode-sign" }
lovenode-phone = { path = "../../crates/lovenode-phone" }
lovenode-keystore = { path = "../../crates/lovenode-keystore" }
